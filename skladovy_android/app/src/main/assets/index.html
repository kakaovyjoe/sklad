<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#123a32"><title>Skladový systém</title>
<style>
:root{--green:#123a32;--green2:#1c5b4e;--bg:#f2f5f4;--line:#dce4e1;--red:#b42318;--muted:#61716c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#18221f}header{background:var(--green);color:white;padding:16px 16px 12px;position:sticky;top:0;z-index:4;box-shadow:0 2px 8px #0002}header h1{font-size:21px;margin:0 0 12px}.tabs{display:flex;gap:7px;overflow:auto}.tab{border:1px solid #ffffff55;color:white;background:#ffffff12;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:650}.tab.active{background:white;color:var(--green)}main{max-width:1000px;margin:auto;padding:12px}.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.search{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:white}.btn{border:0;border-radius:10px;padding:12px 13px;font:700 14px system-ui;cursor:pointer;touch-action:manipulation}.primary{background:var(--green2);color:white}.light{background:#e6eeeb;color:var(--green)}.danger{background:#fff0ef;color:var(--red)}.product{background:white;border:1px solid var(--line);border-radius:14px;margin:9px 0;padding:13px}.prodhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pname{font-weight:750;font-size:16px}.ean{color:var(--muted);font-size:12px;margin-top:3px}.count{font-size:23px;font-weight:800;white-space:nowrap;color:var(--green)}.sub{font-size:12px;color:var(--muted);margin:7px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{min-height:49px;font-size:15px}.manual{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}.manual label{font-size:11px;color:var(--muted)}.manual input,.edit input{width:100%;min-width:0;margin-top:4px;padding:9px 5px;border:1px solid var(--line);border-radius:8px;font:inherit}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.section{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.section h2{font-size:18px;margin:0 0 12px}.summaryrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.summaryrow:last-child{border:0}.summaryrow small{display:block;color:var(--muted)}.summaryrow strong{font-size:18px}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{font-size:12px;color:var(--muted);padding:8px 2px}.hidden{display:none!important}@media(min-width:700px){.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.product{align-self:start}.manual{gap:8px}.stat strong{font-size:26px}}
</style></head><body><header><h1>📦 Skladový systém</h1><nav class="tabs"><button class="tab active" data-tab="Kaucuk">Kaucuk</button><button class="tab" data-tab="Chemie">Chemie</button><button class="tab" data-tab="summary">Přehled a součet</button><button class="tab" data-tab="calc">Výpočet</button><button class="tab" data-tab="data">Data zboží</button></nav></header><main><div class="totals"><div class="stat"><small>Kaucuk · kusy</small><strong id="rubberTotal">0</strong></div><div class="stat"><small>Chemie · kusy</small><strong id="chemTotal">0</strong></div><div class="stat"><small>Celkem kusů</small><strong id="allTotal">0</strong></div></div><div id="content"></div><div class="notice">Změny se automaticky ukládají do tohoto zařízení.</div></main>
<script>
const stateKey='skladovyTablet.v1'; const products=[{"ean": "8590000000001", "name": "Materiál 1"}, {"ean": "8590000000002", "name": "Materiál 2"}, {"ean": "8590000000003", "name": "Materiál 3"}, {"ean": "8590000000004", "name": "Materiál 4"}, {"ean": "8590000000005", "name": "Materiál 5"}, {"ean": "8590000000006", "name": "Materiál 6"}, {"ean": "8590000000007", "name": "Materiál 7"}, {"ean": "8590000000008", "name": "Materiál 8"}, {"ean": "8590000000009", "name": "Materiál 9"}, {"ean": "8590000000010", "name": "Materiál 10"}, {"ean": "8590000000011", "name": "Materiál 11"}, {"ean": "8590000000012", "name": "Materiál 12"}, {"ean": "8590000000013", "name": "Materiál 13"}, {"ean": "8590000000014", "name": "Materiál 14"}, {"ean": "8590000000015", "name": "Materiál 15"}, {"ean": "8590000000016", "name": "Materiál 16"}, {"ean": "8590000000017", "name": "Materiál 17"}, {"ean": "8590000000018", "name": "Materiál 18"}, {"ean": "8590000000019", "name": "Materiál 19"}, {"ean": "8590000000020", "name": "Materiál 20"}, {"ean": "8590000000021", "name": "Materiál 21"}, {"ean": "8590000000022", "name": "Materiál 22"}, {"ean": "8590000000023", "name": "Materiál 23"}, {"ean": "8590000000024", "name": "Materiál 24"}, {"ean": "8590000000025", "name": "Materiál 25"}, {"ean": "8590000000026", "name": "Materiál 26"}, {"ean": "8590000000027", "name": "Materiál 27"}, {"ean": "8590000000028", "name": "Materiál 28"}, {"ean": "8590000000029", "name": "Materiál 29"}, {"ean": "8590000000030", "name": "Materiál 30"}, {"ean": "8590000000031", "name": "Materiál 31"}, {"ean": "8590000000032", "name": "Materiál 32"}, {"ean": "8590000000033", "name": "Materiál 33"}, {"ean": "8590000000034", "name": "Materiál 34"}, {"ean": "8590000000035", "name": "Materiál 35"}, {"ean": "8590000000036", "name": "Materiál 36"}, {"ean": "8590000000037", "name": "Materiál 37"}, {"ean": "8590000000038", "name": "Materiál 38"}, {"ean": "8590000000039", "name": "Materiál 39"}, {"ean": "8590000000040", "name": "Materiál 40"}, {"ean": "8590000000041", "name": "Materiál 41"}, {"ean": "8590000000042", "name": "Materiál 42"}, {"ean": "8590000000043", "name": "Materiál 43"}, {"ean": "8590000000044", "name": "Materiál 44"}, {"ean": "8590000000045", "name": "Materiál 45"}, {"ean": "8590000000046", "name": "Materiál 46"}, {"ean": "8590000000047", "name": "Materiál 47"}, {"ean": "8590000000048", "name": "Materiál 48"}, {"ean": "8590000000049", "name": "Materiál 49"}, {"ean": "8590000000050", "name": "Materiál 50"}, {"ean": "8590000000051", "name": "Materiál 51"}, {"ean": "8590000000052", "name": "Materiál 52"}, {"ean": "8590000000053", "name": "Materiál 53"}, {"ean": "8590000000054", "name": "Materiál 54"}, {"ean": "8590000000055", "name": "Materiál 55"}, {"ean": "8590000000056", "name": "Materiál 56"}, {"ean": "8590000000057", "name": "Materiál 57"}, {"ean": "8590000000058", "name": "Materiál 58"}, {"ean": "8590000000059", "name": "Materiál 59"}, {"ean": "8590000000060", "name": "Materiál 60"}, {"ean": "8590000000061", "name": "Materiál 61"}, {"ean": "8590000000062", "name": "Materiál 62"}, {"ean": "8590000000063", "name": "Materiál 63"}, {"ean": "8590000000064", "name": "Materiál 64"}, {"ean": "8590000000065", "name": "Materiál 65"}, {"ean": "8590000000066", "name": "Materiál 66"}, {"ean": "8590000000067", "name": "Materiál 67"}, {"ean": "8590000000068", "name": "Materiál 68"}, {"ean": "8590000000069", "name": "Materiál 69"}, {"ean": "8590000000070", "name": "Materiál 70"}, {"ean": "8590000000071", "name": "Materiál 71"}, {"ean": "8590000000072", "name": "Materiál 72"}, {"ean": "8590000000073", "name": "Materiál 73"}, {"ean": "8590000000074", "name": "Materiál 74"}, {"ean": "8590000000075", "name": "Materiál 75"}, {"ean": "8590000000076", "name": "Materiál 76"}, {"ean": "8590000000077", "name": "Materiál 77"}, {"ean": "8590000000078", "name": "Materiál 78"}, {"ean": "8590000000079", "name": "Materiál 79"}, {"ean": "8590000000080", "name": "Materiál 80"}, {"ean": "8590000000081", "name": "Materiál 81"}, {"ean": "8590000000082", "name": "Materiál 82"}, {"ean": "8590000000083", "name": "Materiál 83"}, {"ean": "8590000000084", "name": "Materiál 84"}, {"ean": "8590000000085", "name": "Materiál 85"}, {"ean": "8590000000086", "name": "Materiál 86"}, {"ean": "8590000000087", "name": "Materiál 87"}, {"ean": "8590000000088", "name": "Materiál 88"}, {"ean": "8590000000089", "name": "Materiál 89"}, {"ean": "8590000000090", "name": "Materiál 90"}, {"ean": "8590000000091", "name": "Materiál 91"}, {"ean": "8590000000092", "name": "Materiál 92"}, {"ean": "8590000000093", "name": "Materiál 93"}, {"ean": "8590000000094", "name": "Materiál 94"}, {"ean": "8590000000095", "name": "Materiál 95"}, {"ean": "8590000000096", "name": "Materiál 96"}, {"ean": "8590000000097", "name": "Materiál 97"}, {"ean": "8590000000098", "name": "Materiál 98"}, {"ean": "8590000000099", "name": "Materiál 99"}, {"ean": "8590000000100", "name": "Materiál 100"}, {"ean": "8590000000101", "name": "Materiál 101"}, {"ean": "8590000000102", "name": "Materiál 102"}, {"ean": "8590000000103", "name": "Materiál 103"}, {"ean": "8590000000104", "name": "Materiál 104"}, {"ean": "8590000000105", "name": "Materiál 105"}, {"ean": "8590000000106", "name": "Materiál 106"}, {"ean": "8590000000107", "name": "Materiál 107"}, {"ean": "8590000000108", "name": "Materiál 108"}, {"ean": "8590000000109", "name": "Materiál 109"}, {"ean": "8590000000110", "name": "Materiál 110"}, {"ean": "8590000000111", "name": "Materiál 111"}, {"ean": "8590000000112", "name": "Materiál 112"}, {"ean": "8590000000113", "name": "Materiál 113"}, {"ean": "8590000000114", "name": "Materiál 114"}, {"ean": "8590000000115", "name": "Materiál 115"}, {"ean": "8590000000116", "name": "Materiál 116"}, {"ean": "8590000000117", "name": "Materiál 117"}, {"ean": "8590000000118", "name": "Materiál 118"}, {"ean": "8590000000119", "name": "Materiál 119"}, {"ean": "8590000000120", "name": "Materiál 120"}]; let state={}; let active='Kaucuk'; let query='';
const $=s=>document.querySelector(s); const fmt=n=>Number(n||0).toLocaleString('cs-CZ');
function blank(){return {pack:12,boxClicks:0,unitClicks:0,manual:[0,0,0,0,0]}}
function itemState(sheet,ean){if(!state[sheet])state[sheet]={};if(!state[sheet][ean])state[sheet][ean]=blank();return state[sheet][ean]}
function total(it){return (Number(it.boxClicks)||0)*(Number(it.pack)||12)+(Number(it.unitClicks)||0)+(it.manual||[]).reduce((a,b)=>a+(Number(b)||0),0)}
function sum(sheet){return products.reduce((a,p)=>a+total(itemState(sheet,p.ean)),0)}
function save(){localStorage.setItem(stateKey,JSON.stringify(state));renderStats()}
function renderStats(){$('#rubberTotal').textContent=fmt(sum('Kaucuk'));$('#chemTotal').textContent=fmt(sum('Chemie'));$('#allTotal').textContent=fmt(sum('Kaucuk')+sum('Chemie'))}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function productCard(p,sheet){const it=itemState(sheet,p.ean);return `<article class="product"><div class="prodhead"><div><div class="pname">${safe(p.name)}</div><div class="ean">EAN: ${safe(p.ean)}</div></div><div class="count">${fmt(total(it))} ks</div></div><div class="sub">Krabice: ${fmt(it.boxClicks)} × ${fmt(it.pack)} ks · jednotlivé kusy: ${fmt(it.unitClicks)}</div><div class="actions"><button class="btn primary" data-action="box" data-ean="${p.ean}">＋ KRABICE (${fmt(it.pack)} ks)</button><button class="btn light" data-action="unit" data-ean="${p.ean}">＋ 1 KUS</button></div><div class="row" style="margin-top:8px"><label style="font-size:12px;color:var(--muted)">Velikost krabice</label><input aria-label="Velikost krabice" type="number" min="1" max="100000" value="${it.pack}" data-pack="${p.ean}" style="width:85px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit"><button class="btn danger" data-action="undo" data-ean="${p.ean}">Vrátit klik</button></div><div class="manual">${it.manual.map((v,i)=>`<label>Ruční ${i+1}<input type="number" inputmode="numeric" value="${Number(v)||0}" data-manual="${p.ean}" data-index="${i}"></label>`).join('')}</div></article>`}
function renderShelf(sheet){const list=products.filter(p=>(p.name+' '+p.ean).toLowerCase().includes(query.toLowerCase()));return `<div class="toolbar"><input class="search" id="search" placeholder="Hledat název nebo EAN…" value="${safe(query)}"><button class="btn danger" data-action="reset-sheet" data-sheet="${sheet}">Vynulovat ${sheet}</button></div><div class="notice">Kliknutí na krabici přičte nastavený počet kusů. Počty se ukládají automaticky.</div><div class="products">${list.map(p=>productCard(p,sheet)).join('')||'<div class="empty">Nic nenalezeno.</div>'}</div>`}
function renderSummary(){return `<div class="section"><h2>Přehled a součet</h2><div class="summaryrow"><div>Kaucuk<small>Celkem kusů</small></div><strong>${fmt(sum('Kaucuk'))}</strong><button class="btn light" data-goto="Kaucuk">Otevřít</button></div><div class="summaryrow"><div>Chemie<small>Celkem kusů</small></div><strong>${fmt(sum('Chemie'))}</strong><button class="btn light" data-goto="Chemie">Otevřít</button></div><div class="summaryrow"><div><b>CELKOVÝ SOUČET</b><small>Kaucuk + Chemie</small></div><strong>${fmt(sum('Kaucuk')+sum('Chemie'))}</strong><button class="btn primary" data-action="export">Export CSV</button></div></div><div class="section"><h2>Součty podle zboží</h2>${products.map(p=>{let a=total(itemState('Kaucuk',p.ean)),b=total(itemState('Chemie',p.ean));return `<div class="summaryrow"><div>${safe(p.name)}<small>${safe(p.ean)}</small></div><span>${fmt(a)} + ${fmt(b)}</span><strong>${fmt(a+b)} ks</strong></div>`}).join('')}</div>`}
function renderCalc(){return `<div class="section"><h2>Výpočet</h2><p>Stejný automatický součet jako v původním Excelu: krabice × velikost balení + jednotlivé kusy + ruční množství.</p><div class="summaryrow"><div>Počet položek</div><strong>${products.length}</strong><span></span></div><div class="summaryrow"><div>Kaucuk</div><strong>${fmt(sum('Kaucuk'))} ks</strong><span></span></div><div class="summaryrow"><div>Chemie</div><strong>${fmt(sum('Chemie'))} ks</strong><span></span></div><div class="summaryrow"><div>Celkem</div><strong>${fmt(sum('Kaucuk')+sum('Chemie'))} ks</strong><span></span></div><button class="btn primary" data-action="export">Exportovat přehled do CSV</button></div>`}
function renderData(){return `<div class="section"><h2>Data zboží</h2><div class="toolbar"><input class="search" id="search" placeholder="Hledat název nebo EAN…" value="${safe(query)}"></div>${products.filter(p=>(p.name+' '+p.ean).toLowerCase().includes(query.toLowerCase())).map(p=>`<div class="summaryrow"><div>${safe(p.name)}<small>EAN: ${safe(p.ean)}</small></div><span>Kaucuk: ${fmt(total(itemState('Kaucuk',p.ean)))}</span><strong>Chemie: ${fmt(total(itemState('Chemie',p.ean)))}</strong></div>`).join('')}</div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));const c=$('#content');c.innerHTML=active==='Kaucuk'||active==='Chemie'?renderShelf(active):active==='summary'?renderSummary():active==='calc'?renderCalc():renderData();renderStats();const s=$('#search');if(s)s.addEventListener('input',e=>{query=e.target.value;const pos=query.length;render();const ns=$('#search');ns.focus();ns.setSelectionRange(pos,pos)})}
function resetSheet(sheet){if(confirm(`Opravdu vynulovat všechny počty v oddílu ${sheet}?`)){state[sheet]={};save();render()}}
function exportCsv(){const rows=[['EAN','Název','Kaucuk kusy','Chemie kusy','Celkem kusy']];products.forEach(p=>{let a=total(itemState('Kaucuk',p.ean)),b=total(itemState('Chemie',p.ean));rows.push([p.ean,p.name,a,b,a+b])});const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='skladovy_prehled.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){active=tab.dataset.tab;query='';render();return}const go=e.target.closest('[data-goto]');if(go){active=go.dataset.goto;query='';render();return}const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,ean=b.dataset.ean,sheet=b.dataset.sheet;if(act==='reset-sheet'){resetSheet(sheet);return}if(act==='export'){exportCsv();return}if(act==='box'||act==='unit'||act==='minus'||act==='undo'){const it=itemState(active,ean);if(act==='box')it.boxClicks++;if(act==='unit')it.unitClicks++;if(act==='undo'){if(it.unitClicks>0)it.unitClicks--;else if(it.boxClicks>0)it.boxClicks--;else{let idx=it.manual.findIndex(x=>x>0);if(idx>=0)it.manual[idx]=0}}save();render()}});
document.addEventListener('change',e=>{if(e.target.dataset.pack){const it=itemState(active,e.target.dataset.pack);it.pack=Math.max(1,Math.floor(Number(e.target.value)||12));save();render()}if(e.target.dataset.manual!==undefined){const it=itemState(active,e.target.dataset.manual);it.manual[Number(e.target.dataset.index)]=Math.floor(Number(e.target.value)||0);save();render()}});
try{state=JSON.parse(localStorage.getItem(stateKey)||'{}')||{}}catch(e){state={}}render();
</script></body></html>
